name: Windows Release

on:
  push:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      trigger: ${{ steps.version.outputs.trigger }}
      version: ${{ steps.version.outputs.version }}
      type: ${{ steps.version.outputs.type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          msg=$(git log -1 --pretty=%B)

          if [[ "$msg" =~ (release|patch)[[:space:]]([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "trigger=true" >> $GITHUB_OUTPUT
            echo "version=${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.${BASH_REMATCH[4]}" >> $GITHUB_OUTPUT
            echo "type=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "trigger=false" >> $GITHUB_OUTPUT
          fi

  release:
    needs: check
    if: needs.check.outputs.trigger == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get commit author
        id: author
        shell: bash
        run: |
          echo "name=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-SDL3
            mingw-w64-ucrt-x86_64-SDL3_ttf
            mingw-w64-ucrt-x86_64-libass
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-7zip
          msystem: UCRT64

      - name: Add ucrt64 to PATH
        run: echo "C:\msys64\ucrt64\bin" >> $env:GITHUB_PATH

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          ver="${{ needs.check.outputs.version }}"

          awk -v ver="## $ver" '
            $0 == ver {flag=1; found=1; next}
            /^## / && flag {exit}
            flag
          ' CHANGELOG.md > changelog.txt

          if [ ! -s changelog.txt ]; then
            echo "Missing changelog for version $ver"
            exit 1
          fi

          sed -i '/./,$!d' changelog.txt
          tac changelog.txt | sed '/./,$!d' | tac > cleaned.txt

          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat cleaned.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build
        shell: msys2 {0}
        run: |
          gcc nob.c -o nob.exe

      - name: Run build steps
        shell: msys2 {0}
        run: |
          ./nob.exe
          ./nob.exe release distribute

      - name: Ensure dist.zip exists
        shell: bash
        run: |
          if [ ! -f dist.zip ]; then
            echo "dist.zip does not exist"
            exit 1
          fi

      - name: Create tag via API
        shell: bash
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/refs \
            -d '{
              "ref": "refs/tags/v${{ needs.check.outputs.version }}",
              "sha": "${{ github.sha }}"
            }')
          MSG=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('message',''))")
          if [[ "$MSG" != "" && "$MSG" != "Reference already exists" ]]; then
            echo "Tag creation failed: $MSG"
            exit 1
          fi

      - name: Compute release name
        id: relname
        shell: bash
        run: |
          if [ "${{ needs.check.outputs.type }}" = "patch" ]; then
            echo "name=Patch ${{ needs.check.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "name=Release ${{ needs.check.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        shell: bash
        run: |
          PAYLOAD=$(python3 -c "
          import json
          body = open('cleaned.txt').read()
          print(json.dumps({
            'tag_name': 'v${{ needs.check.outputs.version }}',
            'name': '${{ steps.relname.outputs.name }}',
            'body': body,
            'draft': False,
            'prerelease': False
          }))
          ")
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "$PAYLOAD")

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)

          if [[ -z "$RELEASE_ID" ]]; then
            RESPONSE=$(curl -s \
              -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ needs.check.outputs.version }}")
            RELEASE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          fi

          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Upload Asset
        shell: bash
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @dist.zip \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.release_id }}/assets?name=amp-v${{ needs.check.outputs.version }}-win-x86_64.zip"
